<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="GDSS.png">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">

  <style>
    /* Popup container adjustments */
    .popup-chart-container { 
      width: 320px; 
      padding: 5px; 
    }
    
    /* Mapbox wider popup overrides */
    .mapboxgl-popup {
      max-width: 350px !important;
      z-index: 3000;
    }
    
    /* Sidebar Styles */
    .sidebar { 
      background-color: #1c96c5; 
      transition: all 0.3s;
      z-index: 1050;
      overflow-y: auto;
    }
    
    .nav-link { 
      color: rgba(255,255,255,0.8); 
      transition: 0.2s; 
      border-radius: 5px; 
      margin-bottom: 2px; 
    }
    
    .nav-link:hover { 
      background-color: #212529; 
      color: #fff; 
    }
    
    .nav-link.active { 
      background-color: #212529 !important; 
      color: white !important; 
    }
    
    /* Card & UI Refinement */
    .card { border: none; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card-header { border-top-left-radius: 14px !important; border-top-right-radius: 14px !important; font-weight: bold; }
    
    /* Table Aesthetics */
    .table thead th { 
      background-color: #212529; 
      color: white; 
      font-size: 0.85rem;
      padding: 12px;
    }
    
    /* Responsive Layout Logic */
    @media (min-width: 768px) {
      .sidebar { min-height: 100vh; height: 100vh; }
      .main-content { height: 100vh; overflow-y: auto; }
    }
    
    /* Small Sidebar Branding for Mobile */
    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }
    .mobile-brand img { width: 35px; height: 35px; }
    .mobile-brand h6 { margin: 0; font-size: 0.9rem; font-weight: bold; }
    
    /* Custom Scrollbar */
    .main-content::-webkit-scrollbar { width: 6px; }
    .main-content::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    
    /* Map Container */
    #map { width: 100%; height: 100%; border-radius: 10px; }
    .main-content { height: 100vh; overflow-y: auto; }
    
    /* Combined Flood Prone Risk Box */
    #layer-controls {
      position: absolute; top: 15px; left: 15px;
      background: rgba(255, 255, 255, 0.7); 
      padding: 14px 16px; 
      border-radius: 12px; 
      font-size: 14px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
      z-index: 2; 
      min-width: 190px;
      backdrop-filter: blur(8px);
    }
    
    #map-legend2 {
      position: absolute; top: 15px; right: 15px;
      font-size: 12px; background: rgba(255, 255, 255, 0.6); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 1; width: 200px;
    }
    
    .risk-color-box {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-left: 6px;
      margin-right: 6px;
      vertical-align: middle;
    }
    
    /* Popups */
    .popup-chart { width: 100% !important; height: 110px !important; margin-bottom: 6px; }
    .chart-label { font-size: 0.6rem; font-weight: 700; color: #6c757d; text-transform: uppercase; margin-bottom: 2px; display: block; }
  </style>
</head>

<body>
  
  <div class="container-fluid">
    <div class="row">
      
      <nav class="col-lg-2 col-md-3 text-white p-3 sidebar collapse d-md-block" id="sidebarMenu">
        
        <div class="d-md-none mobile-brand">
          <img src="gds.png" class="rounded-circle border border-light" alt="Logo">
          <div>
            <h6 class="text-white">Geospatial DSS</h6>
          </div>
          <button class="btn btn-link text-white ms-auto p-0" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        
        <div class="text-center mb-4 d-none d-md-block">
          <img src="gds.png" class="rounded-circle w-75 mb-2 border shadow-sm" alt="Logo">
          <h6 class="fw-bold mb-0">Geospatial DSS</h6>
        </div>
        
        <ul class="nav flex-column">
          <li class="mb-1"><a class="nav-link text-white active" href="index2.html"><i class="bi bi-moisture me-2"></i>Stations on Map</a></li>
          <li class="mb-1"><a class="nav-link text-white " href="floods3.html"><i class="bi bi-tsunami me-2"></i>Flood Watch</a></li>
          <li class="mb-1"><a class="nav-link text-white" href="tutorial.html"><i class="bi bi-play-circle-fill text-white me-2"></i>Tutorial & Help</a></li>
        </ul>
      </nav>
      
      <main class="col-lg-10 col-md-9 ms-sm-auto px-4 main-content">
        
        <div class="d-flex justify-content-between align-items-center mt-1 mb-1 p-2 bg-white rounded shadow">
          <div class="d-flex align-items-center gap-3">
            <button style="background-color: #1c96c5; color: #fff;" class="btn d-md-none" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
              <i class="bi bi-list"></i>
            </button>
            
            <div class="d-flex align-items-baseline gap-2">
              <h5 class="mb-0 fw-bold text-dark">Stations on Map</h5>
              <span id="lastUpdated" class="text-muted small"></span>

        <div class="row" style="height: 88%;">

              <div id="map"></div>
              
              <!-- FLOOD PRONE RISKS with Color Box Indicators -->
              <div id="layer-controls">
                <h6 class="fw-bold mb-3 text-dark" style="font-size: 13px; letter-spacing: 0.5px;">FLOOD PRONE RISKS</h6>
                
                <div class="form-check mb-2 d-flex align-items-center">
                  <input class="form-check-input risk-filter" type="checkbox" value="severe" id="chkSevere" checked>
                  <label class="form-check-label text-dark fw-bold ms-1" for="chkSevere">

                <div class="form-check mb-2 d-flex align-items-center">
                  <input class="form-check-input risk-filter" type="checkbox" value="high" id="chkHigh" checked>
                  <label class="form-check-label text-dark fw-bold ms-1" for="chkHigh">
                    <span class="risk-color-box" style="background-color: #d96100;"></span>High

                <div class="form-check mb-2 d-flex align-items-center">
                  <input class="form-check-input risk-filter" type="checkbox" value="moderate" id="chkModerate" checked>
                  <label class="form-check-label text-dark fw-bold ms-1" for="chkModerate">
                    <span class="risk-color-box" style="background-color: #a87900;"></span>Moderate
                  </label>
                </div>
                
                <div class="form-check mb-1 d-flex align-items-center">
                  <input class="form-check-input risk-filter" type="checkbox" value="low" id="chkLow" checked>
                  <label class="form-check-label text-dark fw-bold ms-1" for="chkLow">
                    <span class="risk-color-box" style="background-color: #55a855;"></span>Low / Safe
                  </label>
                </div>
              </div>
              
              <div id="map-legend2">
                <div class="dropdown w-100 ">
                  <button class="btn rounded btn-sm shadow-sm w-100 d-flex align-items-center justify-content-between dropdown-toggle text-dark" type="button" data-bs-toggle="dropdown">
                    <div class="d-flex align-items-center text-dark">
                      <i class="text-dark bi bi-water me-2"></i>
                      <span>River Stations</span>
                    </div>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-start shadow border-0 w-100" id="riverDropdownMenu" style="max-height:300px; overflow-y:auto;"></ul>
                </div>

            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  
  <!-- Video Popup Modal -->
  <div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="videoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header d-flex justify-content-between align-items-center">
          <h5 class="modal-title" id="videoModalLabel">System Overview Video</h5>
          <div class="d-flex align-items-center gap-2">
            <!-- Unmute/Mute Toggle Control -->
            <button id="unmuteBtn" class="btn btn-sm btn-warning">
              <i class="bi bi-volume-mute-fill"></i> Unmute Audio
            </button>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
        <div class="modal-body p-0">
          <video id="popupVideo" class="w-100" controls autoplay muted playsinline style="border-bottom-left-radius: .3rem; border-bottom-right-radius: .3rem;">
            <source src="users.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let model, minVals = [], maxVals = [];
    let stationMarkersArray = []; 
    let isMapFullyLoaded = false; 
    
    window.onload = function() {
      loadModel();
      
      // Setup Video Modal
      const videoModalElement = document.getElementById('videoModal');
      const videoElement = document.getElementById('popupVideo');
      const unmuteBtn = document.getElementById('unmuteBtn');
      const videoModal = new bootstrap.Modal(videoModalElement);
      
      // Display Modal on load
      videoModal.show();
      
      // Ensure video starts playing muted (bypasses browser autoplay blocks)
      if (videoElement) {
        videoElement.muted = true;
        videoElement.play().catch(err => console.log("Autoplay handled:", err));
      }
      
      // Toggle Audio on Click
      if (unmuteBtn && videoElement) {
        unmuteBtn.addEventListener('click', function() {
          if (videoElement.muted) {
            videoElement.muted = false;
            unmuteBtn.innerHTML = '<i class="bi bi-volume-up-fill"></i> Mute Audio';
            unmuteBtn.classList.replace('btn-warning', 'btn-secondary');
          } else {
            videoElement.muted = true;
            unmuteBtn.innerHTML = '<i class="bi bi-volume-mute-fill"></i> Unmute Audio';
            unmuteBtn.classList.replace('btn-secondary', 'btn-warning');
          }
        });
      }
      
      // Unmute automatically on first global page interaction
      document.addEventListener('click', function enableAudioOnFirstClick() {
        if (videoElement && videoElement.muted) {
          videoElement.muted = false;
          if (unmuteBtn) {
            unmuteBtn.innerHTML = '<i class="bi bi-volume-up-fill"></i> Mute Audio';
            unmuteBtn.classList.replace('btn-warning', 'btn-secondary');
          }
        }
      }, { once: true });
      
      // Stop playback upon closing the modal
      videoModalElement.addEventListener('hidden.bs.modal', function () {
        if (videoElement) {
          videoElement.pause();
        }
      });
    };
    
    const firebaseConfig = {
      apiKey: "AIzaSyBcayr5NOjbrAuLn7bkUovRWVyG4O9wMPk",
      authDomain: "flooded-95eeb.firebaseapp.com",
      projectId: "flooded-95eeb",
      storageBucket: "flooded-95eeb.firebasestorage.app",
      messagingSenderId: "142547476223",
      appId: "1:142547476223:web:70de7014c664e26d0636ca"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storageRef = firebase.storage().ref();
    
    async function loadModel() {
      try {
        const jsonUrl = await storageRef.child('models/flood_model.json').getDownloadURL();
        const weightsUrl = await storageRef.child('models/flood_weights.bin').getDownloadURL();
        const config = await (await fetch(jsonUrl)).json();
        const weights = await (await fetch(weightsUrl)).arrayBuffer();
        
        minVals = config.metadata.minVals;
        maxVals = config.metadata.maxVals;
        
        model = await tf.loadLayersModel(tf.io.fromMemory({
          modelTopology: config.modelTopology,
          weightSpecs: config.weightSpecs,
          weightData: weights
        }));
        console.log("Model loaded for map overlays.");
        if (isMapFullyLoaded) updateMarkers();
      } catch (err) {
        console.error("Model load error:", err);
      }
    }
    
    function normalize(row) {
      return row.map((v, i) => (maxVals[i] - minVals[i]) === 0 ? 0 : (v - minVals[i]) / (maxVals[i] - minVals[i]));
    }
    
    async function getForecast(currentInput) {
      const horizons = [1, 3, 12, 24];
      let last = [...currentInput];
      const predictions = [];
      if (!model) return [0, 0, 0, 0];
      for (const h of horizons) {
        const pred = await model.predict(tf.tensor2d([normalize(last)])).data();
        predictions.push(pred[0] * 100);
        last[0] += 0.05; 
      }
      return predictions;
    }
    
    mapboxgl.accessToken = 'pk.eyJ1IjoibGhlc3RlcjA4IiwiYSI6ImNtaHFmc3BncjBwZGQybHM0NWN3ejNoNnIifQ.2kEE1OBDTgpnse5-F8QGeg';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/lhester08/cmhqgzq0r004601su4m8i8ov1',
      center: [120.5831108, 18.1026371],
      zoom: 10,
      pitch: 55
    });
    
    const getRiskCategory = (v) => {
      if(v >= 80) return 'severe';
      if(v >= 60) return 'high';
      if(v >= 30) return 'moderate';
      return 'low';
    };
    
    const getMarkerColorByProb = (v) => {
      if(v >= 80) return '#dc3545'; 
      if(v >= 60) return '#fd7e14'; 
      if(v >= 30) return '#ffc107'; 
      return '#198754';             
    };
    
    const getFloodColor = (v) => {
      if(v >= 80) return 'rgba(255,0,0,0.6)';
      if(v >= 60) return 'rgba(255, 140, 0, 0.6)';
      if(v >= 30) return 'rgba(255,255,0,0.6)';
      return 'rgba(2, 251, 2, 0.6)';
    };
    
    const floodLayers = [];
    
    map.on('load', () => {
      if (!map.getSource('mapbox-dem')) {
        map.addSource('mapbox-dem', {
          'type': 'raster-dem',
          'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
          'tileSize': 512,
          'maxzoom': 14
        });
      }
      map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
      map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
      
      db.ref('Flooded_Areas').once('value').then(snapshot => {
        const data = snapshot.val();
        if (!data) return;
        
        Object.entries(data).forEach(([id, f], i) => {
          const geo = f.geojson;
          if (!geo) return;
          
          const sourceId = `flood-src-${i}`;
          const layerId = `flood-layer-${i}`;
          map.addSource(sourceId, { type: 'geojson', data: geo });
          
          if (f.type?.toLowerCase() === 'municipality') {
            map.addLayer({
              id: `border-${i}`,
              type: 'line',
              source: sourceId,
              paint: { 'line-color': '#1c96c5', 'line-width': 2 }
            });
          } else {
            map.addLayer({
              id: layerId,
              type: 'fill',
              source: sourceId,
              paint: { 
                'fill-color': getFloodColor(f.vulnerability || 0), 
                'fill-opacity': 0.5 
              }
            });
            floodLayers.push({ layerId, props: f });
          }
        });
      });
    });
    
    map.on('style.load', () => {
      isMapFullyLoaded = true;
      updateMarkers(); 
    });
    
    document.querySelectorAll('.risk-filter').forEach(checkbox => {
      checkbox.addEventListener('change', () => {
        const activeCategories = Array.from(document.querySelectorAll('.risk-filter:checked')).map(cb => cb.value);
        
        floodLayers.forEach(item => {
          const vuln = item.props.vulnerability || 0;
          const category = getRiskCategory(vuln);
          
          if (activeCategories.includes(category)) {
            map.setLayoutProperty(item.layerId, 'visibility', 'visible');
          } else {
            map.setLayoutProperty(item.layerId, 'visibility', 'none');
          }
        });
      });
    });
    
    map.on('click', async (e) => {
      document.querySelectorAll('.mapboxgl-popup').forEach(p => p.remove());
      const { lng, lat } = e.lngLat;
      const elevation = map.queryTerrainElevation(e.lngLat) || 0;
      
      const minElev = 5; 
      const maxElev = 50; 
      
      let calcRisk = 0;
      if (elevation <= minElev) {
        calcRisk = 100;
      } else if (elevation >= maxElev) {
        calcRisk = 5; 
      } else {
        calcRisk = 100 - ((elevation - minElev) / (maxElev - minElev) * 100);
      }
      const finalRisk = Math.round(calcRisk);
      
      let riskColor, riskLabel, badgeClass;
      if (finalRisk >= 80) { 
        riskColor = '#ff0000'; riskLabel = 'Severe'; badgeClass = 'bg-danger'; 
      } else if (finalRisk >= 60) { 
        riskColor = '#ffa500'; riskLabel = 'High'; badgeClass = 'bg-warning text-dark'; 
      } else if (finalRisk >= 30) { 
        riskColor = '#ffff00'; riskLabel = 'Moderate'; badgeClass = 'bg-warning text-dark'; 
      } else { 
        riskColor = '#02fb02'; riskLabel = 'Safe'; badgeClass = 'bg-success'; 
      }
      
      const geoQuery = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${mapboxgl.accessToken}&types=address,neighborhood,locality`;
      
      let address = "Scanning...";
      let barangay = "N/A";
      let municipality = "N/A";
      
      try {
        const resp = await fetch(geoQuery);
        const data = await resp.json();
        if (data.features && data.features.length > 0) {
          address = data.features[0].place_name.split(',')[0];
          data.features[0].context.forEach(ctx => {
            if (ctx.id.includes('neighborhood')) barangay = ctx.text;
            if (ctx.id.includes('place')) municipality = ctx.text;
          });
        }
      } catch (err) { address = "Location unavailable"; }
      
      const html = `
        <div style="padding:10px; min-width: 230px;">
            <h6 class="fw-bold border-bottom mb-2 pb-1" style="color: #1c96c5;">
                <i class="bi bi-water me-1"></i> Elevation Analysis
            </h6>
            
            <div class="mb-2">
                <span class="d-block fw-bold text-dark">${municipality}</span>
                <span class="badge bg-secondary opacity-75" style="font-size:0.7rem;">Brgy. ${barangay}</span>
            </div>

            <div class="row g-0 mb-3 border-top pt-2">
                <div class="col-6 border-end">
                    <small class="text-muted d-block" style="font-size: 0.6rem;">ALTITUDE</small>
                    <span class="fw-bold ${elevation < 10 ? 'text-danger' : ''}">${elevation.toFixed(1)}m ASL</span>
                </div>
                <div class="col-6 ps-2">
                    <small class="text-muted d-block" style="font-size: 0.6rem;">RISK LEVEL</small>
                    <span class="badge ${badgeClass}" style="font-size:0.65rem;">${riskLabel}</span>
                </div>
            </div>

            <div class="p-2 rounded border shadow-sm" style="background: #f8f9fa;">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <small class="fw-bold text-uppercase" style="font-size:0.65rem;">Flood Risk Index</small>
                    <small class="fw-bold" style="color: ${riskColor === '#ffff00' ? '#b8b800' : riskColor};">${finalRisk}%</small>
                </div>
                <div class="progress" style="height: 8px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" 
                         style="width: ${finalRisk}%; background-color: ${riskColor};"></div>
                </div>
                <small class="text-muted d-block mt-1" style="font-size: 0.6rem;">*Computed via Spatio-temporal Elevation Data</small>
            </div>
        </div>`;
      
      new mapboxgl.Popup({ maxWidth: '300px' })
      .setLngLat(e.lngLat)
      .setHTML(html)
      .addTo(map);
    });
    
    const liveDataStore = {
      data: { history: [0, 0, 0, 0, 0], current: { level: 0, flow: 0, rain: 0 } },
      data2: { history: [0, 0, 0, 0, 0], current: { level: 0, flow: 0, rain: 0 } },
      data3: { history: [0, 0, 0, 0, 0], current: { level: 0, flow: 0, rain: 0 } }
    };
    
    ['data', 'data2', 'data3'].forEach(nodeKey => {
      db.ref(nodeKey).orderByKey().limitToLast(5).on('value', snapshot => {
        if (!snapshot.exists()) return;
        
        const entries = [];
        let latestKey = "";
        let latestRecord = null;
        
        snapshot.forEach(child => {
          const val = child.val();
          const key = child.key;
          entries.push(val);
          
          if (key > latestKey) {
            latestKey = key;
            latestRecord = val;
          }
        });
        
        liveDataStore[nodeKey].history = entries.map(e => {
          if (nodeKey === 'data2') return e.water ?? e.level ?? 0;
          return e.level ?? e.water ?? 0;
        });
        
        liveDataStore[nodeKey].current = {
          level: nodeKey === 'data2' ? (latestRecord.water ?? latestRecord.level ?? 0) : (latestRecord.level ?? latestRecord.water ?? 0),
          flow: latestRecord.flow ?? latestRecord.discharge ?? 0,
          rain: latestRecord.rain ?? latestRecord.rainfall ?? 0
        };
        
        console.log(`Verified Sync [${nodeKey}] Latest Key ID: ${latestKey} Mapped Current Level: ${liveDataStore[nodeKey].current.level}`);
        
        if (isMapFullyLoaded) {
          updateMarkers();
        }
      });
    });
    
    const rivers = [
    { name: "Baldi River", lat: 18.3471177, lng: 120.630181, node: 'data' }, 
    { name: "Padsan River", lat: 18.094349, lng: 120.7089923, node: 'data2' }, 
    { name: "Bislak River", lat: 18.2375679, lng: 120.6748498, node: 'data3' } 
    ];
    
    const riverMenu = document.getElementById('riverDropdownMenu');
    
    async function updateMarkers() {
      stationMarkersArray.forEach(m => m.remove());
      stationMarkersArray = [];
      
      if (riverMenu) riverMenu.innerHTML = '';
      
      for (let idx = 0; idx < rivers.length; idx++) {
        const river = rivers[idx];
        const histChartId = `riverHist-${idx}`;
        const probChartId = `riverProb-${idx}`;
        
        const data = liveDataStore[river.node];
        const cur = data.current;
        const elevation = map.queryTerrainElevation([river.lng, river.lat]) || 0;
        
        let prob = 0;
        let forecastData = [0, 0, 0, 0];
        if (model && minVals.length > 0) {
          forecastData = await getForecast([cur.level, cur.rain, cur.flow, elevation]);
          prob = Math.round(forecastData[0]);
        }
        
        const calculatedPinColor = getMarkerColorByProb(prob);
        const sideAnchor = (idx % 2 === 0) ? 'top' : 'bottom';
        
        const popup = new mapboxgl.Popup({ 
          offset: 25,
          anchor: sideAnchor 
        });
        
        const marker = new mapboxgl.Marker({ color: calculatedPinColor })
        .setLngLat([river.lng, river.lat])
        .setPopup(popup)
        .addTo(map);
        
        marker.getElement().addEventListener('click', (e) => {
          e.stopPropagation();
          map.flyTo({ center: [river.lng, river.lat], zoom: 14 });
          marker.togglePopup();
        });
        
        stationMarkersArray.push(marker);
        
        if (riverMenu) {
          const li = document.createElement('li');
          li.innerHTML = `<a class="dropdown-item small" href="#"><i class="bi bi-geo-alt" style="color: ${calculatedPinColor}"></i> ${river.name}</a>`;
          li.onclick = () => {
            map.flyTo({ center: [river.lng, river.lat], zoom: 14 });
            if (!marker.getPopup().isOpen()) marker.togglePopup();
          };
          riverMenu.appendChild(li);
        }
        
        popup.on('open', async () => {
          const currentPopupEl = popup.getElement();
          document.querySelectorAll('.mapboxgl-popup').forEach(p => {
            if (p !== currentPopupEl) p.remove();
          });
          
          popup.setHTML(`
          <div class="popup-chart-container">
              <h6 class="fw-bold mb-2 text-dark border-bottom pb-1" style="font-size: 0.85rem;">${river.name}</h6>
              <div class="d-flex justify-content-between mb-2 text-center border-bottom pb-2">
                  <div><small class="text-muted d-block" style="font-size: 0.55rem;">LEVEL</small><strong style="font-size: 0.75rem;">${cur.level}m</strong></div>
                  <div><small class="text-muted d-block" style="font-size: 0.55rem;">FLOW</small><strong style="font-size: 0.75rem;">${cur.flow}</strong></div>
                  <div><small class="text-muted d-block" style="font-size: 0.55rem;">RAIN</small><strong style="font-size: 0.75rem;">${cur.rain}</strong></div>
                  <div><small class="text-muted d-block" style="font-size: 0.55rem;">PROB</small><strong style="color: ${calculatedPinColor}; font-size: 0.75rem;">${prob}%</strong></div>
              </div>
              <span hidden class="chart-label">Daily Historical Metrics</span>
              <canvas hidden id="${histChartId}" class="popup-chart"></canvas>
              <div class="mt-2 border-top pt-2">
                  <span class="chart-label">Hourly Forecast Probability</span>
                  <canvas id="${probChartId}" class="popup-chart"></canvas>
              </div>
          </div>
        `);
          
          setTimeout(() => {
            const hCtx = document.getElementById(histChartId);
            if (hCtx) {
              new Chart(hCtx, {
                type: 'line',
                data: {
                  labels: ["-4h", "-3h", "-2h", "-1h", "Now"],
                  datasets: [
                  { label: 'Level', data: data.history, borderColor: '#1f77b4', backgroundColor: 'rgba(31, 119, 180, 0.1)', fill: true, tension: 0.4, pointRadius: 2 },
                  { label: 'Rain', data: data.history.map(v => v * 15), borderColor: '#2ca02c', borderDash: [3, 3], fill: false, tension: 0.4, pointRadius: 0 }
                  ]
                },
                options: {
                  plugins: { legend: { display: true, labels: { boxWidth: 8, font: { size: 9 } } } },
                  maintainAspectRatio: false,
                  scales: { x: { grid: { display: false }, ticks: { font: { size: 8 } } }, y: { ticks: { font: { size: 8 } } } }
                }
              });
            }
            
            const pCtx = document.getElementById(probChartId);
            if (pCtx) {
              new Chart(pCtx, {
                type: 'line',
                data: {
                  labels: ["Now", "+3h", "+12h", "+24h"],
                  datasets: [{
                    label: 'Prob %',
                    data: forecastData,
                    borderColor: calculatedPinColor,
                    backgroundColor: 'rgba(0,0,0,0.03)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 3
                  }]
                },
                options: {
                  plugins: { legend: { display: false } },
                  maintainAspectRatio: false,
                  scales: { x: { grid: { display: false }, ticks: { font: { size: 8 } } }, y: { beginAtZero: true, max: 100, ticks: { font: { size: 8 } } } }
                }
              });
            }
          }, 200); 
        });
      }
    }
  </script>
</body>
</html>
