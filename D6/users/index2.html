<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geospatial DSS | Flood Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="GDSS.png">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* Global Base */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f4f6f9;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Sidebar Styles */
    .sidebar { 
      background-color: #1c96c5; 
      transition: all 0.3s;
      z-index: 1050;
      overflow-y: auto;
    }
    
    .nav-link { 
      color: rgba(255,255,255,0.8); 
      transition: 0.2s; 
      border-radius: 5px; 
      margin-bottom: 2px; 
    }
    
    .nav-link:hover, .nav-link.active { 
      background-color: #212529 !important; 
      color: #fff !important; 
    }
    
    /* Card & UI Refinement */
    .card { border: none; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card-header { border-top-left-radius: 14px !important; border-top-right-radius: 14px !important; font-weight: bold; }
    
    /* Table Aesthetics */
    .table thead th { 
      background-color: #212529; 
      color: white; 
      font-size: 0.85rem;
      padding: 10px;
    }
    
    /* Responsive Layout Logic */
    @media (min-width: 768px) {
      .sidebar { min-height: 100vh; height: 100vh; }
      .main-content { height: 100vh; overflow-y: auto; }
    }
    
    /* Small Sidebar Branding for Mobile */
    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 15px;
    }
    .mobile-brand img { width: 35px; height: 35px; }
    .mobile-brand h6 { margin: 0; font-size: 0.9rem; font-weight: bold; }
    
    /* Custom Scrollbar */
    .main-content::-webkit-scrollbar { width: 6px; }
    .main-content::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    
    /* Map Container Height adjustments for Mobile/Desktop */
    #map { width: 100%; height: 100%; border-radius: 10px; }
    .map-col { height: 50vh; }
    .table-col { height: auto; }
    
    @media (min-width: 992px) {
      .map-col { height: 100%; }
      .table-col { height: 100%; display: flex; flex-direction: column; }
    }
    
    .main-content { height: 100vh; overflow-y: auto; }
    
    /* Collapsible Flood Prone Risks Box */
    #layer-controls {
      position: absolute; top: 15px; left: 15px;
      background: rgba(255, 255, 255, 0.85); 
      padding: 10px; 
      border-radius: 12px; 
      font-size: 14px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
      z-index: 2; 
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    
    #layer-controls.collapsed .collapse-target {
      display: none;
    }
    
    #layer-controls-toggle {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #333;
      padding: 0;
      line-height: 1;
    }
    
    .risk-color-box {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-left: 6px;
      margin-right: 6px;
      vertical-align: middle;
    }

    #stationUnderListCanvas {
      cursor: pointer;
      transition: transform 0.2s;
    }
    #stationUnderListCanvas:hover {
      transform: scale(1.01);
    }
  </style>
</head>

<body>

    <div class="row">

          <img src="gds.png" class="rounded-circle border border-light" alt="Logo">
          <div>
            <h6 class="text-white">Geospatial DSS</h6>

      <main class="col-lg-10 col-md-9 ms-sm-auto px-4 main-content">
        
        <div class="d-flex justify-content-between align-items-center mt-1 mb-1 p-2 bg-white rounded shadow">
          <div class="d-flex align-items-center gap-3">
            <button style="background-color: #1c96c5; color: #fff;" class="btn d-md-none" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">

            <div class="d-flex align-items-baseline gap-2">
              <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-router-fill"></i>Stations on Map</h5>

          <!-- Map Column -->

              <div id="map"></div>
              
              <!-- FLOOD PRONE RISKS Collapsible Control Box (UNCHECKED BY DEFAULT) -->
              <div id="layer-controls">

                  <h6 class="fw-bold mb-0 text-dark collapse-target" style="font-size: 14px; letter-spacing: 0.5px;">FLOOD PRONE RISKS</h6>

          <!-- Table and Chart Column -->
          <div class="col-lg-4 table-col">

            <!-- DEDICATED CLICKABLE CHART PANEL UNDER THE LIST -->

  <!-- EXPANDABLE CHART MODAL -->
  <div class="modal fade" id="chartExpandModal" tabindex="-1" aria-hidden="true">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let model, minVals = [], maxVals = [];
    let stationMarkersArray = []; 
    let activeListChartInstance = null; 
    let expandedModalChartInstance = null;
    let isMapFullyLoaded = false; 
    let firebaseThresholds = {};
    let dynamicStations = [];
    let liveDataStore = {};
    let selectedStationIndex = 0;
    
    function toggleLayerControls() {
      document.getElementById('layer-controls')?.classList.toggle('collapsed');
    }
    
    window.onload = function() {
      loadModel();
      setupLiveThresholds();
      setupLiveStations();

      // Bind Chart Expand Listener
      document.getElementById('stationUnderListCanvas')?.addEventListener('click', openExpandedChartModal);
    };
    
    const firebaseConfig = {
      apiKey: "AIzaSyBcayr5NOjbrAuLn7bkUovRWVyG4O9wMPk",
      authDomain: "flooded-95eeb.firebaseapp.com",
      projectId: "flooded-95eeb",
      storageBucket: "flooded-95eeb.firebasestorage.app",
      messagingSenderId: "142547476223",
      appId: "1:142547476223:web:70de7014c664e26d0636ca"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storageRef = firebase.storage().ref();
    
    function setupLiveThresholds() {
      db.ref('threshold').on('value', snapshot => {
        firebaseThresholds = snapshot.exists() ? snapshot.val() : {};
        if (isMapFullyLoaded) updateMarkers();
      });
    }

    function setupLiveStations() {
      db.ref('stations').on('value', snapshot => {
        if (!snapshot.exists()) {
          db.ref('pins').once('value', pinSnap => {
            if (pinSnap.exists()) {
              const loaded = [];
              pinSnap.forEach(child => {
                const p = child.val();
                if (p.node) {
                  const nodeKey = p.node;
                  loaded.push({
                    id: child.key,
                    name: (p.station || p.stationName || p.station_name || p.name || p.barangayName || "River Station").trim(),
                    lat: parseFloat(p.lat ?? p.latitude ?? 18.19),
                    lng: parseFloat(p.lng ?? p.longitude ?? 120.59),
                    node: nodeKey
                  });
                  subscribeToNodeTelemetry(nodeKey);
                }
              });
              dynamicStations = loaded;
            } else {
              dynamicStations = [];
            }
            if (isMapFullyLoaded) updateMarkers();
          });
        } else {
          const loaded = [];
          snapshot.forEach(child => {
            const st = child.val();
            const nodeKey = st.node || st.dataNode || "data";
            const stationTitle = st.station || st.stationName || st.station_name || st.name || "River Station";
            
            loaded.push({
              id: child.key,
              name: String(stationTitle).trim(),
              lat: parseFloat(st.lat ?? st.latitude ?? 18.19),
              lng: parseFloat(st.lng ?? st.longitude ?? 120.59),
              node: nodeKey
            });
            subscribeToNodeTelemetry(nodeKey);
          });
          dynamicStations = loaded;
          if (isMapFullyLoaded) updateMarkers();
        }
      });
    }

    function subscribeToNodeTelemetry(nodeKey) {
      if (liveDataStore[nodeKey]) return;
      
      liveDataStore[nodeKey] = { history: [], current: { level: 0, flow: 0, rain: 0 } };
      
      db.ref(nodeKey).orderByKey().limitToLast(240).on('value', snapshot => {
        if (!snapshot.exists()) return;
        
        const historyRecords = [];
        let latestRecord = null;
        
        snapshot.forEach(child => {
          const val = child.val();
          historyRecords.push(val);
          latestRecord = val;
        });
        
        liveDataStore[nodeKey].history = historyRecords;
        liveDataStore[nodeKey].current = {
          level: parseFloat(latestRecord.level ?? latestRecord.water ?? latestRecord.water_level ?? 0),
          flow: parseFloat(latestRecord.flow ?? latestRecord.discharge ?? 0),
          rain: parseFloat(latestRecord.rain ?? latestRecord.rainfall ?? 0)
        };
        
        if (isMapFullyLoaded) updateMarkers();
      });
    }

    async function loadModel() {
      try {
        const jsonUrl = await storageRef.child('models/flood_model.json').getDownloadURL();
        const weightsUrl = await storageRef.child('models/flood_weights.bin').getDownloadURL();
        const config = await (await fetch(jsonUrl)).json();
        const weights = await (await fetch(weightsUrl)).arrayBuffer();
        
        minVals = config.metadata.minVals;
        maxVals = config.metadata.maxVals;
        
        model = await tf.loadLayersModel(tf.io.fromMemory({
          modelTopology: config.modelTopology,
          weightSpecs: config.weightSpecs,
          weightData: weights
        }));
        if (isMapFullyLoaded) updateMarkers();
      } catch (err) {
        console.error("Model load error:", err);
      }
    }
    
    function normalize(row) {
      return row.map((v, i) => (maxVals[i] - minVals[i]) === 0 ? 0 : (v - minVals[i]) / (maxVals[i] - minVals[i]));
    }
    
    async function predict24HourWaterLevelForecast(nodeKey, elevation) {
      const dataStore = liveDataStore[nodeKey];
      const cur = dataStore ? dataStore.current : { level: 0, rain: 0, flow: 0 };
      const history = dataStore ? dataStore.history : [];
      
      const horizons = [0, 3, 12, 24]; 
      
      let historicalTrend = 0;
      if (history.length >= 2) {
        const oldest = parseFloat(history[0].level ?? history[0].water ?? cur.level);
        const newest = cur.level;
        historicalTrend = (newest - oldest) / history.length;
      }

      if (!model || minVals.length === 0) {
        return horizons.map(h => parseFloat((cur.level + (historicalTrend * h)).toFixed(2)));
      }

      let lastFeatureState = [cur.level, cur.rain, cur.flow, elevation];
      const projectedLevels = [];

      for (let i = 0; i < horizons.length; i++) {
        const stepHours = horizons[i];
        
        const predictedRiskProb = tf.tidy(() => {
          const normInputs = normalize(lastFeatureState);
          return model.predict(tf.tensor2d([normInputs])).dataSync()[0];
        });

        const levelDelta = (predictedRiskProb - 0.5) * 0.4 + (historicalTrend * stepHours * 0.1);
        const nextLevel = Math.max(0, lastFeatureState[0] + levelDelta);
        
        projectedLevels.push(parseFloat(nextLevel.toFixed(2)));
        lastFeatureState[0] = nextLevel;
      }

      return projectedLevels;
    }
    
    mapboxgl.accessToken = 'pk.eyJ1IjoibGhlc3RlcjA4IiwiYSI6ImNtaHFmc3BncjBwZGQybHM0NWN3ejNoNnIifQ.2kEE1OBDTgpnse5-F8QGeg';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/lhester08/cmhqgzq0r004601su4m8i8ov1',
      center: [120.587385, 18.187710],
      zoom: 9.5,
      pitch: 55
    });
    
    function getDynamicClassFromThreshold(nodeKey, metricKey, val) {
      const nodeLimits = firebaseThresholds[nodeKey] || firebaseThresholds['default'] || firebaseThresholds || {};
      const metricLimits = nodeLimits[metricKey] || nodeLimits[`${metricKey}Threshold`] || {};
      
      const criticalLimit = parseFloat(metricLimits.critical ?? metricLimits.danger ?? (metricKey === 'level' ? 4.0 : metricKey === 'rain' ? 15.0 : 50.0));
      const warningLimit = parseFloat(metricLimits.warning ?? metricLimits.orange ?? (metricKey === 'level' ? 2.5 : metricKey === 'rain' ? 7.5 : 25.0));

      if (val >= criticalLimit) return 'text-danger fw-bold';
      if (val >= warningLimit) return 'text-warning fw-bold';
      return 'text-success fw-bold';
    }

    function getMarkerColorFromThreshold(nodeKey, waterLevel) {
      const nodeLimits = firebaseThresholds[nodeKey] || firebaseThresholds['default'] || firebaseThresholds || {};
      const levelLimits = nodeLimits['level'] || nodeLimits['levelThreshold'] || {};
      
      const criticalLimit = parseFloat(levelLimits.critical ?? levelLimits.danger ?? 4.0);
      const warningLimit = parseFloat(levelLimits.warning ?? levelLimits.orange ?? 2.5);

      if (waterLevel >= criticalLimit) return '#dc3545';
      if (waterLevel >= warningLimit) return '#fd7e14';
      return '#198754';
    }

    const getRiskCategory = (v) => {
      if(v >= 80) return 'severe';
      if(v >= 60) return 'high';
      if(v >= 30) return 'moderate';
      return 'low';
    };
    
    const getFloodColor = (v) => {
      if(v >= 80) return 'rgba(255,0,0,0.6)';
      if(v >= 60) return 'rgba(255, 140, 0, 0.6)';
      if(v >= 30) return 'rgba(255,255,0,0.6)';
      return 'rgba(2, 251, 2, 0.6)';
    };
    
    const floodLayers = [];
    
    map.on('load', () => {
      if (!map.getSource('mapbox-dem')) {
        map.addSource('mapbox-dem', {
          'type': 'raster-dem',
          'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
          'tileSize': 512,
          'maxzoom': 14
        });
      }
      map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
      map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

      // Dynamic markers and list render BEFORE vector flood map loads
      if (isMapFullyLoaded) updateMarkers();
      
      // Load flood-prone layers AFTER list & chart render pipeline initializes
      db.ref('Flooded_Areas').once('value').then(snapshot => {
        const data = snapshot.val();
        if (!data) return;
        
        Object.entries(data).forEach(([id, f], i) => {
          const geo = f.geojson;
          if (!geo) return;
          
          const sourceId = `flood-src-${i}`;
          const layerId = `flood-layer-${i}`;
          map.addSource(sourceId, { type: 'geojson', data: geo });
          
          if (f.type?.toLowerCase() === 'municipality') {
            map.addLayer({
              id: `border-${i}`,
              type: 'line',
              source: sourceId,
              paint: { 'line-color': '#1c96c5', 'line-width': 2 }
            });
          } else {
            map.addLayer({
              id: layerId,
              type: 'fill',
              source: sourceId,
              layout: { 'visibility': 'none' }, // Unchecked / hidden by default
              paint: { 
                'fill-color': getFloodColor(f.vulnerability || 0), 
                'fill-opacity': 0.5 
              }
            });
            floodLayers.push({ layerId, props: f });
          }
        });
      });
    });
    
    map.on('style.load', () => {
      isMapFullyLoaded = true;
      updateMarkers(); 
    });
    
    document.querySelectorAll('.risk-filter').forEach(checkbox => {
      checkbox.addEventListener('change', () => {
        const activeCategories = Array.from(document.querySelectorAll('.risk-filter:checked')).map(cb => cb.value);
        
        floodLayers.forEach(item => {
          const vuln = item.props.vulnerability || 0;
          const category = getRiskCategory(vuln);
          
          if (activeCategories.includes(category)) {
            map.setLayoutProperty(item.layerId, 'visibility', 'visible');
          } else {
            map.setLayoutProperty(item.layerId, 'visibility', 'none');
          }
        });
      });
    });
    
    const stationTableBody = document.getElementById('stationTableBody');
    
    async function updateMarkers() {
      stationMarkersArray.forEach(m => m.remove());
      stationMarkersArray = [];
      
      if (stationTableBody) stationTableBody.innerHTML = '';
      
      if (dynamicStations.length === 0 && stationTableBody) {
        stationTableBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No river stations available.</td></tr>`;
        return;
      }
      
      for (let idx = 0; idx < dynamicStations.length; idx++) {
        const river = dynamicStations[idx];
        const dataStore = liveDataStore[river.node] || { current: { level: 0, flow: 0, rain: 0 }, history: [] };
        const cur = dataStore.current;
        
        const calculatedPinColor = getMarkerColorFromThreshold(river.node, cur.level);
        const levelColorClass = getDynamicClassFromThreshold(river.node, 'level', cur.level);
        const rainColorClass = getDynamicClassFromThreshold(river.node, 'rain', cur.rain);
        const flowColorClass = getDynamicClassFromThreshold(river.node, 'flow', cur.flow);
        
        // Clean marker (NO MAP POPUPS)
        const marker = new mapboxgl.Marker({ color: calculatedPinColor })
          .setLngLat([river.lng, river.lat])
          .addTo(map);
        
        marker.getElement().addEventListener('click', (e) => {
          e.stopPropagation();
          map.flyTo({ center: [river.lng, river.lat], zoom: 14 });
          selectStationAndRenderBottomChart(idx);
        });
        
        stationMarkersArray.push(marker);
        
        if (stationTableBody) {
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><strong>${river.name}</strong></td>
            <td class="${levelColorClass}">${cur.level.toFixed(2)}m</td>
            <td class="${rainColorClass}">${cur.rain.toFixed(1)}mm</td>
            <td class="${flowColorClass}">${cur.flow.toFixed(1)}m³/s</td>
          `;
          tr.onclick = () => {
            map.flyTo({ center: [river.lng, river.lat], zoom: 14 });
            selectStationAndRenderBottomChart(idx);
          };
          stationTableBody.appendChild(tr);
        }
      }

      if (dynamicStations.length > 0) {
        await selectStationAndRenderBottomChart(selectedStationIndex);
      }
    }

    async function generateChartDataForStation(idx) {
      if (idx < 0 || idx >= dynamicStations.length) return null;
      
      const river = dynamicStations[idx];
      const dataStore = liveDataStore[river.node] || { current: { level: 0, flow: 0, rain: 0 }, history: [] };
      const cur = dataStore.current;
      const historyData = dataStore.history;
      const elevation = map.queryTerrainElevation([river.lng, river.lat]) || 0;
      
      const sampledHistory = [];
      const sampledLabels = [];
      if (historyData.length > 0) {
        const step = Math.max(1, Math.floor(historyData.length / 6));
        for (let i = 0; i < historyData.length; i += step) {
          const item = historyData[i];
          const lev = parseFloat(item.level ?? item.water ?? item.water_level ?? 0);
          sampledHistory.push(lev);
          
          let hoursAgo = Math.round((historyData.length - i));
          let label = hoursAgo >= 24 ? `-` + Math.round(hoursAgo / 24) + `d` : `-` + hoursAgo + `h`;
          sampledLabels.push(label);
        }
      }
      
      const forecastWaterLevels = await predict24HourWaterLevelForecast(river.node, elevation);
      const combinedChartLabels = [...sampledLabels, "Now", "+3h", "+12h", "+24h"];
      const historySeries = [...sampledHistory, cur.level, null, null, null];
      const forecastSeries = Array(sampledHistory.length).fill(null);
      forecastSeries.push(...forecastWaterLevels);
      
      const calculatedPinColor = getMarkerColorFromThreshold(river.node, cur.level);

      return {
        river,
        combinedChartLabels,
        historySeries,
        forecastSeries,
        calculatedPinColor
      };
    }

    async function selectStationAndRenderBottomChart(idx) {
      selectedStationIndex = idx;
      const chartData = await generateChartDataForStation(idx);
      if (!chartData) return;

      const { river, combinedChartLabels, historySeries, forecastSeries, calculatedPinColor } = chartData;

      const titleElem = document.getElementById("selectedStationChartTitle");
      const tagElem = document.getElementById("selectedStationNodeTag");
      
      if (titleElem) titleElem.innerHTML = `<i class="bi bi-graph-up me-1 text-primary"></i> ${river.name}`;
      if (tagElem) tagElem.innerText = `Click to Expand`;

      const pCtx = document.getElementById("stationUnderListCanvas");
      if (!pCtx) return;
      
      if (activeListChartInstance) {
        activeListChartInstance.destroy();
      }

      activeListChartInstance = new Chart(pCtx, {
        type: 'line',
        data: {
          labels: combinedChartLabels,
          datasets: [
            {
              label: '10-Day Logs (m)',
              data: historySeries,
              borderColor: '#1c96c5',
              backgroundColor: 'rgba(28, 150, 197, 0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: 2
            },
            {
              label: '24h ML Forecast (m)',
              data: forecastSeries,
              borderColor: calculatedPinColor,
              borderDash: [4, 4],
              backgroundColor: 'rgba(0,0,0,0.03)',
              fill: false,
              tension: 0.4,
              pointRadius: 3
            }
          ]
        },
        options: {
          plugins: { 
            legend: { 
              display: true,
              labels: { boxWidth: 8, font: { size: 9 } }
            } 
          },
          maintainAspectRatio: false,
          scales: { 
            x: { grid: { display: false }, ticks: { font: { size: 8 } } }, 
            y: { ticks: { font: { size: 8 }, callback: v => v + 'm' } } 
          }
        }
      });
    }

    // Opens a full modal view when clicking the chart under the list
    async function openExpandedChartModal() {
      const chartData = await generateChartDataForStation(selectedStationIndex);
      if (!chartData) return;

      const { river, combinedChartLabels, historySeries, forecastSeries, calculatedPinColor } = chartData;

      document.getElementById("expandedChartModalTitle").innerText = `${river.name} — Full Hydrograph & Forecast Analysis`;

      const modalElem = document.getElementById("chartExpandModal");
      const modalInstance = new bootstrap.Modal(modalElem);
      modalInstance.show();

      modalElem.addEventListener('shown.bs.modal', () => {
        const mCtx = document.getElementById("expandedModalCanvas");
        if (!mCtx) return;

        if (expandedModalChartInstance) {
          expandedModalChartInstance.destroy();
        }

        expandedModalChartInstance = new Chart(mCtx, {
          type: 'line',
          data: {
            labels: combinedChartLabels,
            datasets: [
              {
                label: '10-Day Historical Recorded Logs (m)',
                data: historySeries,
                borderColor: '#1c96c5',
                backgroundColor: 'rgba(28, 150, 197, 0.15)',
                fill: true,
                tension: 0.3,
                pointRadius: 4
              },
              {
                label: '24-Hour ML Projected Water Level (m)',
                data: forecastSeries,
                borderColor: calculatedPinColor,
                borderDash: [5, 5],
                backgroundColor: 'rgba(0,0,0,0.02)',
                fill: false,
                tension: 0.4,
                pointRadius: 5
              }
            ]
          },
          options: {
            plugins: { 
              legend: { 
                display: true,
                position: 'top'
              } 
            },
            maintainAspectRatio: false,
            scales: { 
              x: { ticks: { font: { size: 11 } } }, 
              y: { ticks: { font: { size: 11 }, callback: v => v + ' m' } } 
            }
          }
        });
      }, { once: true });
    }
  </script>
