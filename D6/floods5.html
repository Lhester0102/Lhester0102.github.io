<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GDSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link class="icon" href="images/GDSS.png">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* Global Layout & Responsive Height */
    html, body {
      height: 100%;
      margin: 0;
      background: #f4f6f9;
      overflow-x: hidden;
    }

    .main-content {
      min-height: 100vh;
    }

    @media (min-width: 992px) {
      .main-content {
        height: 100vh;
        overflow-y: hidden;
      }
    }
    
    .card { 
      border: none; 
      border-radius: 14px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
    }
    .card-header { 
      border-top-left-radius: 14px !important; 
      border-top-right-radius: 14px !important; 
      font-weight: bold; 
    }
    
    /* Dynamic Responsive Table Container */
    .table-container-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: calc(100vh - 85px);
    }

    .table-responsive { 
      flex: 1 1 auto;
      overflow-y: auto; 
    }

    .table thead th { 
      background-color: #212529 !important; 
      color: white !important; 
      font-size: 0.85rem;
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    /* Webkit Scrollbars */
    .table-responsive::-webkit-scrollbar,
    .main-content::-webkit-scrollbar { 
      width: 6px; 
      height: 6px;
    }
    .table-responsive::-webkit-scrollbar-thumb,
    .main-content::-webkit-scrollbar-thumb { 
      background: #ccc; 
      border-radius: 10px; 
    }
    
    canvas { cursor: pointer; transition: transform 0.2s; }
    canvas:hover { transform: scale(1.01); }
  </style>
</head>

<body>
  <div class="container-fluid p-2 p-md-3">
    <div class="row g-2 g-md-3 main-content">
      
      <!-- LEFT PANEL: CONTROLS AND TELEMETRY WATCHLIST TABLE -->
      <div class="col-12 col-xl-9 d-flex flex-column h-100">
        <div class="card table-container-card mb-2">
          
          <!-- CONTROL TOOLBAR -->
          <div class="card-header bg-dark text-white py-2">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
              
              <!-- Left Controls -->
              <div class="d-flex flex-wrap align-items-center gap-2 flex-grow-1">
                <select id="municipalityFilter" class="form-select form-select-sm bg-white border-white text-dark fw-semibold" style="max-width: 210px; min-width: 150px;">
                  <option value="All">All Covered Municipalities</option>
                </select>
                
                <div style="max-width: 280px; min-width: 160px;" class="flex-grow-1">
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-white text-dark">
                      <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="barangaySearchInput" class="form-control" placeholder="Search barangay...">
                  </div>
                </div>
                
                <select id="rowLimitSelect" class="form-select form-select-sm bg-white border-white text-dark fw-semibold" style="max-width: 110px;">
                  <option value="5">5 Rows</option>
                  <option value="10" selected>10 Rows</option>
                  <option value="25">25 Rows</option>
                  <option value="All">All Rows</option>
                </select>
              </div>

              <!-- Right-aligned Export CSV Button -->
              <div class="ms-auto">
                <button id="btnExportCSV" class="btn btn-sm btn-success">
                  <i class="bi bi-filetype-csv me-1"></i> Export CSV
                </button>
              </div>

            </div>
          </div>
          
          <!-- DYNAMIC SCROLLABLE TABLE -->
          <div class="card-body p-0 table-responsive">
            <table class="table mt-0 table-hover align-middle mb-0 w-100" style="min-width: 720px;">
              <thead class="table-dark">
                <tr>
                  <th class="ps-3" style="width: 11%;">Date</th>
                  <th style="width: 9%;">Time</th>
                  <th style="width: 15%;">Barangay</th>
                  <th style="width: 11%;">Water Level</th>
                  <th style="width: 10%;">Rainfall</th>
                  <th style="width: 11%;">Discharge</th>
                  <th style="width: 10%;">Elevation</th>
                  <th style="width: 13%;">Probable Depth</th>
                  <th style="width: 10%;">Risk</th>
                </tr>
              </thead>
              <tbody id="riverTableBody">
                <tr>
                  <td colspan="9" class="text-center text-dark py-5">
                    <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                    Synchronizing tracking telemetry registries...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <!-- SYSTEM STATUS PANEL -->
        <div class="card mb-1 p-2 flex-shrink-0">
          <p id="status" class="small text-dark mb-0">Initializing system modules...</p>
        </div>
      </div>
      
      <!-- RIGHT PANEL: ANALYTICS & FORECAST -->
      <div class="col-12 col-xl-3 h-100 overflow-y-auto">
        <div class="card p-3 mb-3" id="detailsContainer">
          <div id="details">
            <div class="text-center text-dark py-4 small">
              <i class="bi bi-info-circle d-block mb-2 fs-4 text-dark"></i>
              Select a river station to view analytics.
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  
  <script>
    let model, minVals = [], maxVals = [];
    let allRawPins = [], nodeCoveredPins = [], rivers = [], lastComputedRenderList = [];
    let activeChartInstance = null;
    
    const liveDataStore = {
      data: { level: 1.1, flow: 12.0, rain: 0.1, date: '', time: '' },
      data2: { level: 1.1, flow: 12.0, rain: 0.1, date: '', time: '' },
      data3: { level: 1.1, flow: 12.0, rain: 0.1, date: '', time: '' }
    };
    
    const firebaseConfig = {
      apiKey: "AIzaSyBcayr5NOjbrAuLn7bkUovRWVyG4O9wMPk",
      authDomain: "flooded-95eeb.firebaseapp.com",
      projectId: "flooded-95eeb",
      storageBucket: "flooded-95eeb.firebasestorage.app",
      messagingSenderId: "142547476223",
      appId: "1:142547476223:web:70de7014c664e26d0636ca"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storageRef = firebase.storage().ref();
    
    window.onload = async function() {
      document.getElementById('status').innerHTML = '<span class="loading-spinner"></span> Initializing system modules - Loading registry lists...';
      
      await loadModel(); 
      await fetchAllPinsMetadata(); 
      setupRiverStations();
      
      document.getElementById('barangaySearchInput')?.addEventListener('input', updateRiverTable);
      document.getElementById('rowLimitSelect')?.addEventListener('change', updateRiverTable);
      document.getElementById('municipalityFilter')?.addEventListener('change', async (e) => loadMunicipalityElevations(e.target.value));
      document.getElementById('btnExportCSV')?.addEventListener('click', exportLocalTableToCSV);
      
      const urlParams = new URLSearchParams(window.location.search);
      const nodeParam = urlParams.get('node');
      const levelParam = urlParams.get('level');
      const rainParam = urlParams.get('rain');
      const flowParam = urlParams.get('flow');
      
      if (nodeParam && levelParam !== null && rainParam !== null && flowParam !== null) {
        liveDataStore[nodeParam] = {
          level: parseFloat(levelParam),
          rain: parseFloat(rainParam),
          flow: parseFloat(flowParam),
          date: urlParams.get('date') || '',
          time: urlParams.get('time') || ''
        };
      }
      
      filterPinsAndPopulateDropdown(nodeParam || 'data2');
      await loadMunicipalityElevations('All');
    }
    
    function filterPinsAndPopulateDropdown(targetNode) {
      const select = document.getElementById('municipalityFilter');
      if (!select) return;
      
      if (targetNode === 'data2') {
        nodeCoveredPins = allRawPins.filter(r => r.node === 'data2' || ['Laoag City', 'Laoag', 'San Nicolas'].includes(r.municipality));
      } else if (targetNode === 'data3') {
        nodeCoveredPins = allRawPins.filter(r => r.node === 'data3' || ['Bacarra', 'Vintar'].includes(r.municipality));
      } else if (targetNode === 'data') {
        nodeCoveredPins = allRawPins.filter(r => r.node === 'data' || r.municipality === 'Pasuquin');
      } else {
        nodeCoveredPins = [...allRawPins];
      }
      
      const coveredMunicipalities = [...new Set(nodeCoveredPins.map(r => r.municipality))].sort();
      select.innerHTML = '<option value="All">All Covered Municipalities</option>';
      coveredMunicipalities.forEach(muni => {
        select.add(new Option(muni, muni));
      });
    }
    
    function getDepthCalcString(level, elevation, riskScore) {
      const l = parseFloat(level), e = parseFloat(elevation), prob = parseFloat(riskScore) / 100;
      if (isNaN(l) || isNaN(e) || isNaN(prob)) return '0.00 m';
      
      let baselineDepth = l - (e * (prob - 0.75));
      if (baselineDepth <= 0) return '0.00 m';
      
      let probabilityWeightedDepth = baselineDepth * prob;
      return probabilityWeightedDepth > 0 ? `${probabilityWeightedDepth.toFixed(2)} m` : '0.00 m';
    }
    
    async function fetchAllPinsMetadata() {
      try {
        const snapshot = await db.ref('pins').once('value');
        if (snapshot.exists()) {
          const loadedPins = [];
          const seenBarangays = new Set();
          
          snapshot.forEach(childSnapshot => {
            const pinConfig = childSnapshot.val();
            if (pinConfig.node && pinConfig.latitude && pinConfig.longitude) {
              const nameKey = (pinConfig.name || "Unknown").trim();
              const muniKey = pinConfig.municipality || "Laoag City";
              const uniquelyIdentified = `${muniKey.toLowerCase()}-${nameKey.toLowerCase()}`;
              
              if (!seenBarangays.has(uniquelyIdentified)) {
                seenBarangays.add(uniquelyIdentified);
                loadedPins.push({
                  brgyId: childSnapshot.key, 
                  name: nameKey,
                  municipality: muniKey,
                  lat: parseFloat(pinConfig.latitude),
                  lng: parseFloat(pinConfig.longitude),
                  elevation: 12.5, 
                  node: pinConfig.node 
                });
              }
            }
          });
          allRawPins = loadedPins;
        }
      } catch (error) {
        console.error("Error fetching pins metadata:", error);
        document.getElementById('status').innerText = `Error: ${error.message}`;
      }
    }
    
    async function loadMunicipalityElevations(selectedMuni) {
      let selectedRivers = (selectedMuni === 'All') 
        ? [...nodeCoveredPins] 
        : nodeCoveredPins.filter(river => river.municipality === selectedMuni);
      
      if (selectedRivers.length === 0) {
        rivers = [];
        updateRiverTable();
        return;
      }
      
      document.getElementById('status').innerHTML = `<span class="loading-spinner"></span> Fetching elevation for ${selectedRivers.length} barangays...`;
      
      const chunkSize = 40; 
      let allElevations = [];
      
      for (let i = 0; i < selectedRivers.length; i += chunkSize) {
        const chunk = selectedRivers.slice(i, i + chunkSize);
        const lats = chunk.map(r => r.lat).join(',');
        const lngs = chunk.map(r => r.lng).join(',');
        
        try {
          const response = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`);
          const data = await response.json();
          allElevations.push(...(data?.elevation || chunk.map(() => 12.5)));
          await new Promise(resolve => setTimeout(resolve, 150)); 
        } catch {
          allElevations.push(...chunk.map(() => 12.5));
        }
      }
      
      selectedRivers.forEach((river, index) => {
        if (allElevations[index] !== null && allElevations[index] !== undefined) {
          river.elevation = allElevations[index];
        }
      });
      
      document.getElementById('status').innerText = `✓ Loaded ${selectedRivers.length} barangays in ${selectedMuni === 'All' ? 'all covered municipalities' : selectedMuni}.`;
      rivers = selectedRivers;
      updateRiverTable();
    }
    
    function setupRiverStations() {
      const checkingNode = new URLSearchParams(window.location.search).get('node');
      
      ['data', 'data2', 'data3'].forEach(nodeKey => {
        db.ref(nodeKey).orderByKey().limitToLast(1).on('value', snapshot => {
          if (!snapshot.exists() || checkingNode === nodeKey) return;
          
          snapshot.forEach(child => {
            const latest = child.val();
            liveDataStore[nodeKey] = {
              level: parseFloat(latest.level ?? latest.water ?? latest.water_level ?? 1.1),
              flow: parseFloat(latest.flow ?? latest.discharge ?? 12.0),
              rain: parseFloat(latest.rain ?? latest.rainfall ?? 0.1),
              date: latest.date || liveDataStore[nodeKey].date || '',
              time: latest.time || liveDataStore[nodeKey].time || ''
            };
          });
          updateRiverTable();
        });
      });
    }
    
    function normalize(row) { 
      return row.map((v, i) => (maxVals[i] - minVals[i]) === 0 ? 0 : (v - minVals[i]) / (maxVals[i] - minVals[i])); 
    }
    
    function updateRiverTable() {
      const tableBody = document.getElementById('riverTableBody');
      if (!tableBody) return;
      
      if (rivers.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="9" class="text-center py-5 text-dark small"><i class="bi bi-exclamation-circle d-block mb-2 fs-4 text-dark"></i>No river stations loaded for this selection.</td></tr>`;
        return;
      }
      
      const filterQuery = (document.getElementById('barangaySearchInput')?.value || '').toLowerCase().trim();
      const selectedLimit = document.getElementById('rowLimitSelect')?.value || '10';
      
      let processedList = rivers
        .filter(river => river.name.toLowerCase().includes(filterQuery))
        .map(river => {
          let riskScore = 0;
          const telemetry = liveDataStore[river.node];
          
          if (telemetry && model && minVals.length > 0) {
            try {
              const normFeatures = normalize([telemetry.level, telemetry.rain, telemetry.flow, river.elevation]);
              riskScore = tf.tidy(() => model.predict(tf.tensor2d([normFeatures])).dataSync()[0] * 100);
            } catch (err) {
              console.error("Prediction error:", err);
            }
          }
          return { ...river, computedRisk: riskScore };
        });
      
      processedList.sort((a, b) => b.computedRisk - a.computedRisk);
      
      if (selectedLimit !== 'All') {
        processedList = processedList.slice(0, parseInt(selectedLimit, 10));
      }
      
      lastComputedRenderList = [...processedList]; 
      
      const rowsHtml = processedList.map(river => {
        const telemetry = liveDataStore[river.node];
        if (!telemetry) return '';
        
        const riskScore = river.computedRisk;
        const badgeStyle = riskScore >= 70 ? 'bg-danger' : riskScore >= 40 ? 'bg-warning text-dark' : 'bg-success';
        const depthString = getDepthCalcString(telemetry.level, river.elevation, riskScore);
        
        return `
          <tr style="cursor: pointer;" onclick="triggerStationAnalysis('${river.brgyId}', ${riskScore})">
            <td class="ps-3"><span class="fw-bold text-dark" style="font-size:0.9rem;">${telemetry.date || '-'}</span></td>
            <td><span class="fw-bold text-dark" style="font-size:0.9rem;">${telemetry.time || '-'}</span></td>
            <td>
              <div class="fw-bold text-dark">${river.name}</div>
              <small class="text-dark" style="font-size:0.9rem;">
                <span class="fw-semibold text-primary">${river.municipality}</span>
              </small>
            </td>
            <td><code class="text-dark fw-bold" style="font-size:1rem;">${telemetry.level.toFixed(2)}m</code></td>
            <td><span class="text-dark fw-bold">${telemetry.rain.toFixed(1)} mm</span></td>
            <td><span class="text-dark fw-bold">${telemetry.flow.toFixed(1)} m³/s</span></td>
            <td><span class="text-dark fw-bold">${river.elevation.toFixed(1)}m</span></td>
            <td><span class="text-dark fw-bold">${depthString}</span></td>
            <td><span class="badge ${badgeStyle} px-2 py-1" style="font-size:0.8rem;">${riskScore.toFixed(2)}%</span></td>
          </tr>
        `;
      }).join('');
      
      tableBody.innerHTML = rowsHtml || `<tr><td colspan="9" class="text-center py-5 text-dark small"><i class="bi bi-exclamation-circle d-block mb-2 fs-4 text-dark"></i>No barangays match your selected criteria.</td></tr>`;
    }
    
    function exportLocalTableToCSV() {
      if (lastComputedRenderList.length === 0) {
        alert("No tracking telemetry records available for export.");
        return;
      }
      
      let csvData = "Date,Time,Barangay,Municipality,Water Level,Rainfall,Discharge,Calculated Elevation,Flood Depth,Risk Classification Percentage\n";
      lastComputedRenderList.forEach(item => {
        const tele = liveDataStore[item.node] || { level: 0, rain: 0, flow: 0, date: '', time: '' };
        const depth = getDepthCalcString(tele.level, item.elevation, item.computedRisk);
        csvData += `"${tele.date}","${tele.time}","${item.name}","${item.municipality}","${tele.level.toFixed(2)}m","${tele.rain.toFixed(1)} mm","${tele.flow.toFixed(1)} m³/s","${item.elevation.toFixed(1)}m","${depth}","${item.computedRisk.toFixed(2)}%"\n`;
      });
      
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvData));
      element.setAttribute('download', `GDSS_WatchList_${Date.now()}.csv`);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
    
    async function triggerStationAnalysis(brgyId, riskScore) {
      const river = rivers.find(r => r.brgyId === brgyId);
      if (!river) return;
      
      const telemetry = liveDataStore[river.node];
      const { level: currentWater, rain: currentRain, flow: currentDischarge } = telemetry;
      const elevation = river.elevation;
      
      let interpretText = "Low Risk Scenario", interpretColor = "#198754"; 
      let recommendation = "The area displays low vulnerability under current metrics. Maintain standard community awareness.";
      
      if (riskScore >= 70) {
        interpretText = "Severe Flood Risk";
        interpretColor = "#dc3545"; 
        recommendation = "CRITICAL: High threat detected! Prepare immediate high-ground evacuation protocols.";
      } else if (riskScore >= 40) {
        interpretText = "Moderate Flood Risk";
        interpretColor = "#fd7e14"; 
        recommendation = "CAUTION: Moderate vulnerability observed. Secure low-lying equipment and prepare sandbag lines.";
      }
      
      const waterInterpretText = currentWater > 5.0 ? "Critical" : currentWater > 2.5 ? "Elevated" : "Normal";
      const waterInterpretColor = currentWater > 5.0 ? "#dc3545" : currentWater > 2.5 ? "#fd7e14" : "#198754";
      
      const infoPanel = document.getElementById('details'); 
      if (infoPanel) {
        infoPanel.innerHTML = `
        <div style="font-family: system-ui, sans-serif;">
          <h6 class="fw-bold mb-1 border-bottom pb-2 text-primary" style="font-size: 1.25rem;">Flood Risk Analysis</h6>
          <div class="mb-1 bg-light p-1 rounded border">
            <span class="d-block text-uppercase text-dark fw-bold" style="font-size:1rem;">Location: ${river.name}, ${river.municipality}</span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Elevation:</span>
            <span class="fw-semibold">${elevation.toFixed(1)}m</span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Water Level:</span>
            <span class="fw-semibold">${currentWater.toFixed(2)}m <small style="color: ${waterInterpretColor};">(${waterInterpretText})</small></span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Rainfall:</span>
            <span class="fw-semibold">${currentRain.toFixed(1)} mm</span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Discharge:</span>
            <span class="fw-semibold">${currentDischarge.toFixed(1)} m³/s</span>
          </div>
          <div class="mt-1 pt-1">
            <span class="text-dark d-block text-uppercase" style="font-size: 1rem; font-weight: 700;">Risk Assessment</span>
            <span class="fw-bold d-block" style="color: ${interpretColor}; font-size: 1.25rem;">${interpretText} (${riskScore.toFixed(2)}%)</span>
          </div>
          <div class="mt-2 bg-white border p-2 rounded shadow-sm">
            <span class="text-dark d-block text-uppercase" style="font-size: 0.60rem; font-weight: 700;">Recommendation</span>
            <p class="mb-0 text-dark small mt-1" style="text-align: justify; line-height:1.25;">${recommendation}</p>
          </div>
          <div class="mt-3 pt-2 border-top">
            <span class="text-dark d-block text-uppercase mb-2 fw-bold" style="font-size: 1rem;"><i class="bi bi-graph-up me-1"></i>24-Hour Forecast</span>
            <div style="height: 105px; width: 100%;"><canvas id="sidePanelForecastTrendCanvas"></canvas></div>
          </div>
        </div>
      `;
        
        const forecastData = await getForecast([currentWater, currentRain, currentDischarge, elevation]);
        
        setTimeout(() => {
          const pCtx = document.getElementById('sidePanelForecastTrendCanvas');
          if (!pCtx) return;
          
          if (activeChartInstance) {
            activeChartInstance.destroy();
          }

          activeChartInstance = new Chart(pCtx, {
            type: 'line',
            data: {
              labels: ["Now", "+3h", "+12h", "+24h"],
              datasets: [{
                data: forecastData,
                borderColor: interpretColor,
                backgroundColor: 'rgba(0, 0, 0, 0.02)',
                fill: true,
                tension: 0.4,
                pointRadius: 3
              }]
            },
            options: {
              plugins: { legend: { display: false } },
              maintainAspectRatio: false,
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 8 } } },
                y: { beginAtZero: true, max: 100, ticks: { font: { size: 8 } } }
              }
            }
          });
        }, 50);
      }
    }
    
    async function getForecast(currentInput) {
      if (!model) return [0, 0, 0, 0];
      const horizons = [1, 3, 12, 24];
      let last = [...currentInput];
      const predictions = [];
      
      for (const h of horizons) {
        const pred = tf.tidy(() => model.predict(tf.tensor2d([normalize(last)])).dataSync()[0]);
        predictions.push(pred * 100);
        last[0] += 0.05; 
      }
      return predictions;
    }
    
    async function loadModel() {
      const status = document.getElementById("status");
      try {
        const jsonUrl = await storageRef.child('models/flood_model.json').getDownloadURL();
        const weightsUrl = await storageRef.child('models/flood_weights.bin').getDownloadURL();
        
        const config = await (await fetch(jsonUrl)).json();
        const weights = await (await fetch(weightsUrl)).arrayBuffer();
        
        minVals = config.metadata.minVals;
        maxVals = config.metadata.maxVals;
        
        model = await tf.loadLayersModel(tf.io.fromMemory(config.modelTopology, config.weightSpecs, weights));
        status.innerText = "✓ Model loaded successfully.";
      } catch (err) {
