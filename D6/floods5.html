<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GDSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link class="icon" href="images/GDSS.png">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* Theme Core */
    body { background: #f4f6f9; }
    
    .card { border: none; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

      color: white; 
      font-size: 0.85rem;

      .main-content { height: 100vh; overflow-y: auto; }
    }

    .main-content { height: 100vh; overflow-y: auto; }
    
    canvas { cursor: pointer; transition: transform 0.2s; }
    canvas:hover { transform: scale(1.01); }
    
    .table-responsive { max-height: 460px; overflow-y: auto; }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <main class="col-12 px-3 main-content">
        <div class="d-flex justify-content-between align-items-center mt-2 mb-2 p-2 bg-white rounded shadow">
          <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-baseline gap-2">
              <h5 class="mb-0 fw-bold text-dark">Flood Watch Lists</h5>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-2 mt-md-0">
            <button id="btnExportCSV" class="btn btn-success"><i class="bi bi-filetype-csv me-1"></i> Export CSV</button>
            <a href="floods3.html" class="btn btn-outline-primary"><i class="bi bi-eye me-1"></i> Flood Map</a>
            <a href="floods4.html" class="btn btn-primary"> <i class="bi bi-water me-1"></i>Flood Lists</a>
          </div>
        </div>
        
        <div class="container-fluid p-0">
          <div class="row g-3">
            <div class="col-12 col-lg-9 d-flex flex-column">
              <div class="card mb-2" style="min-height: 500px; min-width: 0;">
                <div class="card-header bg-dark text-white py-2">
                  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <div class="d-flex flex-wrap align-items-center gap-3 w-100 w-lg-auto">
                      <!-- DYNAMIC MUNICIPALITY DROPDOWN BASED ON NODE -->
                      <select id="municipalityFilter" class="form-select form-select-sm bg-white border-white text-dark fw-semibold" style="max-width: 230px;">
                        <option value="All">All Covered Municipalities</option>
                      </select>
                    
                      <div style="max-width: 320px;" class="flex-grow-1">
                        <div class="input-group input-group-sm">
                          <span class="input-group-text bg-white border-white text-dark">
                            <i class="bi bi-search"></i>
                          </span>
                          <input type="text" id="barangaySearchInput" class="form-control" placeholder="Search barangay...">
                        </div>
                      </div>
                    
                      <select id="rowLimitSelect" class="form-select form-select-sm bg-white border-white text-dark fw-semibold" style="max-width: 110px;">
                        <option value="5">5 Rows</option>
                        <option value="10" selected>10 Rows</option>
                        <option value="25">25 Rows</option>
                        <option value="All">All Rows</option>
                      </select>
                    </div>
                  </div>
                </div>
            
                <div class="card-body p-0 ms-0 table-responsive" style="max-height: 570px;">
                  <table class="table mt-1 table-hover align-middle mb-0 w-100" style="table-layout: fixed;">
                    <thead class="table-primary text-white sticky-top">
                      <tr>
                        <th class="ps-3" style="width: 20%;">Barangay</th>
                        <th style="width: 12%;">Water Level</th>
                        <th style="width: 11%;">Rainfall</th>
                        <th style="width: 11%;">Discharge</th>
                        <th style="width: 16%;">Elevation</th>
                        <th style="width: 15%;">Probable Flood Depth</th>
                        <th style="width: 15%;">Risk Classification</th>
                      </tr>
                    </thead>
                    <tbody id="riverTableBody">
                      <tr>
                        <td colspan="7" class="text-center text-dark py-5">
                          <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                          Synchronizing tracking telemetry registries...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
          
              <div class="card mb-1 mt-1 p-2">
                <p id="status" class="small text-dark mb-0">Initializing system modules...</p>
              </div>
            </div>
        
            <div class="col-12 col-lg-3">
              <div class="card p-3" id="detailsContainer">
                <div id="details">
                  <div class="text-center text-dark py-4 small">
                    <i class="bi bi-info-circle d-block mb-2 fs-4 text-dark"></i>
                    Select a river station to view analytics.
                  </div>
                </div>
              </div>
          
              <div class="card p-3 mt-3" hidden>
                <input id="waterLevel" class="form-control mb-1" value="1.1">
                <input id="rainfall" class="form-control mb-1" value="0.1">
                <input id="discharge" class="form-control mb-1" value="12">
                <input id="elevation" class="form-control mb-2" value="25">
                <button hidden id="predictBtn" class="btn btn-danger w-100">Predict</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>
  let model, minVals=[], maxVals=[];
  let parsedCsvFeatures = [], parsedCsvLabels = [];
  let currentMunicipality = null;
  let currentDataListener = null;
  
  let allRawPins = []; 
  let nodeCoveredPins = [];
  let rivers = [];     
  let lastComputedRenderList = [];
  
  const liveDataStore = {
    data: { level: 1.1, flow: 12.0, rain: 0.1 },
    data2: { level: 1.1, flow: 12.0, rain: 0.1 },
    data3: { level: 1.1, flow: 12.0, rain: 0.1 }
  };
  
  const firebaseConfig = {
    apiKey: "AIzaSyBcayr5NOjbrAuLn7bkUovRWVyG4O9wMPk",
    authDomain: "flooded-95eeb.firebaseapp.com",
    projectId: "flooded-95eeb",
    storageBucket: "flooded-95eeb.firebasestorage.app",
    messagingSenderId: "142547476223",
    appId: "1:142547476223:web:70de7014c664e26d0636ca"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const storageRef = firebase.storage().ref();
  
  window.onload = async function() {
    document.getElementById('status').innerHTML = '<span class="loading-spinner"></span> Initializing system modules - Loading registry lists...';
    
    await loadModel(); 
    await fetchAllPinsMetadata(); 
    setupRiverStations();
    
    const barangayInput = document.getElementById('barangaySearchInput');
    if (barangayInput) barangayInput.addEventListener('input', updateRiverTable);
    
    const rowLimitSelect = document.getElementById('rowLimitSelect');
    if (rowLimitSelect) rowLimitSelect.addEventListener('change', updateRiverTable);
    
    const municipalityFilter = document.getElementById('municipalityFilter');
    if (municipalityFilter) {
      municipalityFilter.addEventListener('change', async function(e) {
        await loadMunicipalityElevations(e.target.value);
      });
    }
    
    document.getElementById('btnExportCSV').addEventListener('click', exportLocalTableToCSV);

    // CHECK FOR TELEMETRY SOURCE ROUTING PARAMETERS FROM REPORTS.HTML
    const urlParams = new URLSearchParams(window.location.search);
    const nodeParam = urlParams.get('node');
    const levelParam = urlParams.get('level');
    const rainParam = urlParams.get('rain');
    const flowParam = urlParams.get('flow');
    
    // Override live configuration metrics with clicked data snapshot if present
    if (nodeParam && levelParam !== null && rainParam !== null && flowParam !== null) {
      liveDataStore[nodeParam] = {
        level: parseFloat(levelParam),
        rain: parseFloat(rainParam),
        flow: parseFloat(flowParam)
      };
    }

    // Populate dropdown based on node selected from reports.html
    filterPinsAndPopulateDropdown(nodeParam || 'data2');
    await loadMunicipalityElevations('All');
  }
  
  function filterPinsAndPopulateDropdown(targetNode) {
    const select = document.getElementById('municipalityFilter');
    if (!select) return;

    // Filter raw pins according to the basin node coverage
    if (targetNode === 'data2') { // Padsan -> Laoag & San Nicolas
      nodeCoveredPins = allRawPins.filter(r => r.node === 'data2' || r.municipality === 'Laoag City' || r.municipality === 'Laoag' || r.municipality === 'San Nicolas');
    } else if (targetNode === 'data3') { // Bislak -> Bacarra & Vintar
      nodeCoveredPins = allRawPins.filter(r => r.node === 'data3' || r.municipality === 'Bacarra' || r.municipality === 'Vintar');
    } else if (targetNode === 'data') { // Baldi -> Pasuquin
      nodeCoveredPins = allRawPins.filter(r => r.node === 'data' || r.municipality === 'Pasuquin');
    } else {
      nodeCoveredPins = [...allRawPins];
    }

    // Extract unique covered municipalities for the dropdown
    const coveredMunicipalities = [...new Set(nodeCoveredPins.map(r => r.municipality))].sort();

    select.innerHTML = '<option value="All">All Covered Municipalities</option>';
    coveredMunicipalities.forEach(muni => {
      const opt = document.createElement('option');
      opt.value = muni;
      opt.textContent = muni;
      select.appendChild(opt);
    });
  }

  function getDepthCalcString(level, elevation, riskScore) {
    const l = parseFloat(level);
    const e = parseFloat(elevation);
    const prob = parseFloat(riskScore) / 100;
    
    if (isNaN(l) || isNaN(e) || isNaN(prob)) return '0.00 m';
    
    let baselineDepth = l - (e*(prob-0.75));
    if (baselineDepth <= 0) return '0.00 m';
    
    let probabilityWeightedDepth = baselineDepth * prob;
    return probabilityWeightedDepth > 0 ? probabilityWeightedDepth.toFixed(2) + ' m' : '0.00 m';
  }
  
  function detachCurrentDataListener() {
    if (currentDataListener && currentDataListener.off) {
      currentDataListener.off('value');
    }
    currentDataListener = null;
  }
  
  function processMunicipalitySnapshot(snapshot, sourceName) {
    if (!snapshot.exists()) return;
    document.getElementById('status').innerHTML = `${sourceName} matrix updates synced successfully.`;
    manualPredict();
  }
  
  function subscribeToMunicipalityData(municipality) {
    if (!municipality || currentMunicipality === municipality) return;
    detachCurrentDataListener();
    currentMunicipality = municipality;
    
    let refPath = 'data';
    if (municipality === 'Laoag City' || municipality === 'Laoag' || municipality === 'San Nicolas') {
      refPath = 'data2';
    } else if (municipality === 'Bacarra' || municipality === 'Vintar') {
      refPath = 'data3';
    } else if (municipality === 'Pasuquin') {
      refPath = 'data';
    }
    
    const ref = db.ref(refPath).orderByKey().limitToLast(1);
    currentDataListener = ref;
    ref.on('value', snapshot => processMunicipalitySnapshot(snapshot, refPath));
  }
  
  async function fetchAllPinsMetadata() {
    try {
      const snapshot = await db.ref('pins').once('value');
      if (snapshot.exists()) {
        const loadedPins = [];
        const seenBarangays = new Set();
        
        snapshot.forEach(childSnapshot => {
          const pinConfig = childSnapshot.val();
          if (pinConfig.node && pinConfig.latitude && pinConfig.longitude) {
            const nameKey = (pinConfig.name || "Unknown").trim();
            const lowerKey = nameKey.toLowerCase();
            const muniKey = pinConfig.municipality || "Laoag City";
            const uniquelyIdentified = `${muniKey.toLowerCase()}-${lowerKey}`;
            
            if (!seenBarangays.has(uniquelyIdentified)) {
              seenBarangays.add(uniquelyIdentified);
              
              loadedPins.push({
                brgyId: childSnapshot.key, 
                name: nameKey,
                municipality: muniKey,
                textMuni: muniKey,
                lat: parseFloat(pinConfig.latitude),
                lng: parseFloat(pinConfig.longitude),
                elevation: 12.5, 
                node: pinConfig.node 
              });
            }
          }
        });
        
        allRawPins = loadedPins;
      }
    } catch (error) {
      console.error("Error fetching pins metadata:", error);
      document.getElementById('status').innerHTML = `Error: ${error.message}`;
    }
  }

  async function loadMunicipalityElevations(selectedMuni) {
    let selectedRivers = [];
    
    if (selectedMuni === 'All') {
      selectedRivers = [...nodeCoveredPins];
    } else {
      selectedRivers = nodeCoveredPins.filter(river => river.municipality === selectedMuni);
    }
    
    if (selectedRivers.length === 0) {
      rivers = [];
      updateRiverTable();
      return;
    }

    document.getElementById('status').innerHTML = `<span class="loading-spinner"></span> Fetching elevation for ${selectedRivers.length} barangays...`;
    
    const chunkSize = 40; 
    const chunks = [];
    for (let i = 0; i < selectedRivers.length; i += chunkSize) {
      chunks.push(selectedRivers.slice(i, i + chunkSize));
    }
    
    let allElevations = [];
    for (let chunkIndex = 0; chunkIndex < chunks.length; chunkIndex++) {
      const chunk = chunks[chunkIndex];
      const lats = chunk.map(r => r.lat).join(',');
      const lngs = chunk.map(r => r.lng).join(',');
      
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`);
        const data = await response.json();
        
        if (data && data.elevation) {
          allElevations = [...allElevations, ...data.elevation];
        } else {
          allElevations = [...allElevations, ...chunk.map(() => 12.5)];
        }
        await new Promise(resolve => setTimeout(resolve, 200)); 
      } catch (apiErr) {
        console.error(`API error for batch ${chunkIndex + 1}:`, apiErr);
        allElevations = [...allElevations, ...chunk.map(() => 12.5)];
      }
    }
    
    selectedRivers.forEach((river, index) => {
      if (allElevations[index] !== null && allElevations[index] !== undefined) {
        river.elevation = allElevations[index];
      }
    });
    
    document.getElementById('status').innerHTML = `✓ Loaded ${selectedRivers.length} barangays in ${selectedMuni === 'All' ? 'all covered municipalities' : selectedMuni}.`;
    rivers = selectedRivers;
    updateRiverTable();
  }
  
  function setupRiverStations() {
    const urlParams = new URLSearchParams(window.location.search);
    const checkingNode = urlParams.get('node');

    ['data', 'data2', 'data3'].forEach(nodeKey => {
      db.ref(nodeKey).orderByKey().limitToLast(1).on('value', snapshot => {
        if (!snapshot.exists()) return;
        if (checkingNode && checkingNode === nodeKey) return; 
        
        snapshot.forEach(child => {
          const latest = child.val();
          liveDataStore[nodeKey] = {
            level: parseFloat(latest.level ?? latest.water ?? latest.water_level ?? 1.1),
            flow: parseFloat(latest.flow ?? latest.discharge ?? 12.0),
            rain: parseFloat(latest.rain ?? latest.rainfall ?? 0.1)
          };
        });
        updateRiverTable();
      });
    });
  }
  
  function updateRiverTable() {
    const tableBody = document.getElementById('riverTableBody');
    if (!tableBody) return;
    
    tableBody.innerHTML = '';
    
    if (rivers.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-5 text-dark small">
            <i class="bi bi-exclamation-circle d-block mb-2 fs-4 text-dark"></i>
            No river stations loaded for this selection.
          </td>
        </tr>`;
      return;
    }
    
    const barangayInput = document.getElementById('barangaySearchInput');
    const filterQuery = barangayInput ? barangayInput.value.toLowerCase().trim() : '';
    const selectedLimit = document.getElementById('rowLimitSelect').value;
    
    let processedList = rivers.filter(river => 
      river.name.toLowerCase().includes(filterQuery)
    );
    
    processedList = processedList.map(river => {
      let riskScore = 0;
      const telemetry = liveDataStore[river.node];
      
      if (telemetry && model && minVals.length > 0 && maxVals.length > 0) {
        try {
          const rawFeatures = [telemetry.level, telemetry.rain, telemetry.flow, river.elevation];
          const normFeatures = normalize(rawFeatures);
          
          riskScore = tf.tidy(() => {
            const predictionTensor = model.predict(tf.tensor2d([normFeatures]));
            return predictionTensor.dataSync()[0] * 100;
          });
        } catch (err) {
          console.error("Tensor matrix calculations error:", err);
        }
      }
      return { ...river, computedRisk: riskScore };
    });
    
    // Sort by Barangay Name first, then Municipality Name second
    processedList.sort((a, b) => {
      const nameCompare = a.name.localeCompare(b.name);
      if (nameCompare !== 0) {
        return nameCompare;
      }
      return a.municipality.localeCompare(b.municipality);
    });
    
    if (selectedLimit !== 'All') {
      const limitCount = parseInt(selectedLimit, 10);
      processedList = processedList.slice(0, limitCount);
    }
    
    lastComputedRenderList = [...processedList]; 
    
    for (const river of processedList) {
      const telemetry = liveDataStore[river.node];
      if (!telemetry) continue;
      
      const elevation = river.elevation;
      const riskScore = river.computedRisk;
      let badgeStyle = 'bg-success';
      
      if (riskScore >= 70) {
        badgeStyle = 'bg-danger';
      } else if (riskScore >= 40) {
        badgeStyle = 'bg-warning text-dark';
      }
      
      const depthString = getDepthCalcString(telemetry.level, elevation, riskScore);
      
      const tr = document.createElement('tr');
      tr.style.cursor = 'pointer';
      tr.onclick = () => { triggerStationAnalysis(river, riskScore); };
      
      tr.innerHTML = `
        <td class="ps-3">
          <div class="fw-bold text-dark">${river.name}</div>
          <small class="text-dark" style="font-size:1.1rem;">
            <span class="fw-semibold text-primary">${river.municipality}</span>
          </small>
         </td>
         <td><code class="text-dark fw-bold" style="font-size:1.1rem; ">${telemetry.level.toFixed(2)}m</code></td>
         <td><span class="text-dark fw-bold" >${telemetry.rain.toFixed(1)} mm</span></td>
         <td><span class="text-dark fw-bold">${telemetry.flow.toFixed(1)} m³/s</span></td>
         <td><span class="text-dark fw-bold">${elevation.toFixed(1)}m</span></td>
         <td><span class="text-dark fw-bold ">${depthString}</span></td>
         <td><span class="badge ${badgeStyle} px-2 py-1" style="font-size:0.8rem;">${riskScore.toFixed(2)}%</span></td>
      `;
      tableBody.appendChild(tr);
    }
    
    if (processedList.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-5 text-dark small">
            <i class="bi bi-exclamation-circle d-block mb-2 fs-4 text-dark"></i>
            No barangays match your selected criteria.
          </td>
        </tr>`;
    }
  }
  
  function exportLocalTableToCSV() {
    if (lastComputedRenderList.length === 0) {
      alert("No tracking telemetry records available for export.");
      return;
    }
    
    let csvData = "Barangay,Municipality,Water Level,Rainfall,Discharge,Calculated Elevation,Flood Depth,Risk Classification Percentage\n";
    lastComputedRenderList.forEach(item => {
      const tele = liveDataStore[item.node] || { level: 0, rain: 0, flow: 0 };
      const depth = getDepthCalcString(tele.level, item.elevation, item.computedRisk);
      csvData += `"${item.name}","${item.municipality}","${tele.level.toFixed(2)}m","${tele.rain.toFixed(1)} mm","${tele.flow.toFixed(1)} m³/s","${item.elevation.toFixed(1)}m","${depth}","${item.computedRisk.toFixed(2)}%"\n`;
    });
    
    const element = document.createElement('a');
    element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvData));
    element.setAttribute('download', `GDSS_WatchList_${new Date().getTime()}.csv`);
    element.style.display = 'none';
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
  }
  
  async function triggerStationAnalysis(river, riskScore) {
    const telemetry = liveDataStore[river.node];
    const elevation = river.elevation;
    
    const currentWater = telemetry.level;
    const currentRain = telemetry.rain;
    const currentDischarge = telemetry.flow;
    
    document.getElementById('waterLevel').value = currentWater;
    document.getElementById('rainfall').value = currentRain;
    document.getElementById('discharge').value = currentDischarge;
    document.getElementById('elevation').value = elevation;
    
    let interpretText = "Low Risk Scenario";
    let interpretColor = "#198754"; 
    let recommendation = "The area displays low vulnerability under current metrics. Maintain standard community awareness.";
    
    if (riskScore >= 70) {
      interpretText = "Severe Flood Risk";
      interpretColor = "#dc3545"; 
      recommendation = `CRITICAL: High threat detected! Prepare immediate high-ground evacuation protocols.`;
    } else if (riskScore >= 40) {
      interpretText = "Moderate Flood Risk";
      interpretColor = "#fd7e14"; 
      recommendation = `CAUTION: Moderate vulnerability observed. Secure low-lying equipment and prepare sandbag lines.`;
    }
    
    let waterInterpretText = "Normal";
    let waterInterpretColor = "#198754"; 
    if (currentWater > 5.0) { waterInterpretText = "Critical"; waterInterpretColor = "#dc3545"; }
    else if (currentWater > 2.5) { waterInterpretText = "Elevated"; waterInterpretColor = "#fd7e14"; }
    
    const probChartId = `sidePanelForecastTrendCanvas`;
    const infoPanel = document.getElementById('details'); 
    
    if (infoPanel) {
      infoPanel.innerHTML = `
        <div style="font-family: system-ui, sans-serif;">
          <h6 class="fw-bold mb-1 border-bottom pb-2 text-primary" style="font-size: 1.25rem;">Flood Risk Analysis</h6>
          <div class="mb-1 bg-light p-1 rounded border">
            <span class="d-block text-uppercase text-dark fw-bold" style="font-size:1rem;">Location: ${river.name}, ${river.municipality}</span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Elevation:</span>
            <span class="fw-semibold">${elevation.toFixed(1)}m</span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Water Level:</span>
            <span class="fw-semibold">${currentWater.toFixed(2)}m <small style="color: ${waterInterpretColor};">(${waterInterpretText})</small></span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Rainfall:</span>
            <span class="fw-semibold">${currentRain.toFixed(1)} mm</span>
          </div>
          <div style="font-size: 1rem;" class="d-flex justify-content-between mb-1 small border-bottom pb-1">
            <span class="text-dark">Discharge:</span>
            <span class="fw-semibold">${currentDischarge.toFixed(1)} m³/s</span>
          </div>
          <div class="mt-1 pt-1">
            <span class="text-dark d-block text-uppercase" style="font-size: 1rem; font-weight: 700;">Risk Assessment</span>
            <span class="fw-bold d-block" style="color: ${interpretColor}; font-size: 1.25rem;">${interpretText} (${riskScore.toFixed(2)}%)</span>
          </div>
          <div class="mt-2 bg-white border p-2 rounded shadow-sm">
            <span class="text-dark d-block text-uppercase" style="font-size: 0.60rem; font-weight: 700;">Recommendation</span>
            <p class="mb-0 text-dark small mt-1" style="text-align: justify; line-height:1.25;">${recommendation}</p>
          </div>
          <div class="mt-3 pt-2 border-top">
            <span class="text-dark d-block text-uppercase mb-2 fw-bold" style="font-size: 1rem;"><i class="bi bi-graph-up me-1"></i>24-Hour Forecast</span>
            <div style="height: 105px; width: 100%;"><canvas id="${probChartId}"></canvas></div>
          </div>
        </div>
      `;
      
      const forecastData = await getForecast([currentWater, currentRain, currentDischarge, elevation]);
      
      setTimeout(() => {
        const pCtx = document.getElementById(probChartId);
        if (!pCtx) return;
        new Chart(pCtx, {
          type: 'line',
          data: {
            labels: ["Now", "+3h", "+12h", "+24h"],
            datasets: [{
              data: forecastData,
              borderColor: interpretColor,
              backgroundColor: 'rgba(0, 0, 0, 0.02)',
              fill: true,
              tension: 0.4,
              pointRadius: 3
            }]
          },
          options: {
            plugins: { legend: { display: false } },
            maintainAspectRatio: false,
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 8 } } },
              y: { beginAtZero: true, max: 100, ticks: { font: { size: 8 } } }
            }
          }
        });
      }, 80);
    }
    
    let municipality = river.municipality;
    if (municipality) subscribeToMunicipalityData(municipality);
  }
  
  async function getForecast(currentInput) {
    const horizons = [1, 3, 12, 24];
    let last = [...currentInput];
    const predictions = [];
    if (!model) return [0, 0, 0, 0];
    for (const h of horizons) {
      const pred = tf.tidy(() => {
        return model.predict(tf.tensor2d([normalize(last)])).dataSync()[0];
      });
      predictions.push(pred * 100);
      last[0] += 0.05; 
    }
    return predictions;
  }
  
  function normalize(row){ return row.map((v,i)=> (maxVals[i]-minVals[i])===0?0:(v-minVals[i])/(maxVals[i]-minVals[i])); }
  
  function manualPredict(){
    if(!model) return;
    const input = [
      parseFloat(document.getElementById('waterLevel').value), 
      parseFloat(document.getElementById('rainfall').value), 
      parseFloat(document.getElementById('discharge').value), 
      parseFloat(document.getElementById('elevation').value)
    ];
    const horizons = [1, 3, 12, 24];
    let last = [...input];
    const predictions = [];
    for(const h of horizons){
      const pred = tf.tidy(() => {
        return model.predict(tf.tensor2d([normalize(last)])).dataSync()[0];
      });
      predictions.push(pred * 100);
      last[0] += 0.05; 
    }
  }
  
  async function loadModel() {
    const status = document.getElementById("status");
    try {
      const jsonUrl = await storageRef.child('models/flood_model.json').getDownloadURL();
      const weightsUrl = await storageRef.child('models/flood_weights.bin').getDownloadURL();
      
      const config = await (await fetch(jsonUrl)).json();
      const weights = await (await fetch(weightsUrl)).arrayBuffer();
      
      minVals = config.metadata.minVals;
      maxVals = config.metadata.maxVals;
      
      model = await tf.loadLayersModel(tf.io.fromMemory(config.modelTopology, config.weightSpecs, weights));
      status.innerHTML = "✓ Model loaded successfully.";
    } catch (err) {
      status.innerHTML = "Using default risk calculations. Model not available.";
      console.error(err);
    }
  }
</script>
